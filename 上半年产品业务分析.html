<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>山东分公司上半年产品业务分析</title>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:,">
<style>
body{margin:0;background:#f3f7fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#162334}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #d8e2ef;background:#fff}
h1{font-size:20px;margin:0}.tabs{display:flex;gap:8px}button{height:34px;border:1px solid #c8d8ee;background:#fff;border-radius:6px;padding:0 13px;cursor:pointer}button.active{background:#2563a8;color:#fff;border-color:#2563a8}
iframe{display:block;width:100%;height:calc(100vh - 64px);border:0}
@media(max-width:720px){header{height:auto;align-items:flex-start;flex-direction:column;gap:10px;padding:12px 14px}h1{font-size:18px;line-height:1.35}.tabs{width:100%;overflow-x:auto;padding-bottom:2px}button{flex:0 0 auto}iframe{height:calc(100vh - 112px)}}
</style></head><body>
<header><h1>山东分公司 2026年上半年产品业务分析</h1><div class="tabs"><button data-src="嵌入-标准销量.html" class="">标准销量</button><button data-src="嵌入-标准保有.html" class="">标准保有</button><button data-src="嵌入-产品收入.html" class="active">产品收入</button><button data-src="嵌入-私募.html" class="">私募</button><button data-src="嵌入-专项.html" class="">专项</button></div></header>
<iframe id="frame" src="嵌入-产品收入.html"></iframe>
<script>
const frame = document.getElementById('frame');
const stamp = () => `v=${Date.now()}`;
function loadPanel(src){
  const glue = src.includes('?') ? '&' : '?';
  frame.src = `${src}${glue}${stamp()}`;
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadPanel(b.dataset.src);});
loadPanel('嵌入-产品收入.html');
</script>
</body></html>
