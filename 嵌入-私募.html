function rowsToBranchMonthSummary(sourceRows){
  const branchMap = new Map();
  const monthTotals = new Map(months.map(m=>[m,{month:m,total:0,min:Infinity,max:-Infinity}]));
  sourceRows.forEach(row=>{
    const branch = row.branch || '未标注营业部';
    const month = row.month;
    const amount = row.amount_wan || 0;
    if(!monthTotals.has(month)) return;
    const branchRow = branchMap.get(branch) || {branch,total_wan:0,values:{}};
    branchRow.values[month] = (branchRow.values[month] || 0) + amount;
    branchRow.total_wan += amount;
    branchMap.set(branch, branchRow);
  });
  const branchRows = [...branchMap.values()].sort((a,b)=>b.total_wan-a.total_wan);
  const totalRow = {branch:'分公司整体', total_wan:0, values:{}};
  branchRows.forEach(r=>{ totalRow.total_wan += r.total_wan; months.forEach(m=>{ totalRow.values[m] = (totalRow.values[m] || 0) + (r.values[m] || 0); }); });
  branchRows.forEach(r=>months.forEach(m=>{ const stat = monthTotals.get(m); const v = r.values[m] || 0; stat.total += v; stat.min = Math.min(stat.min, v); stat.max = Math.max(stat.max, v); }));
  const columns = months.map(m=>({key:m,label:m,stats:monthTotals.get(m)}));
  return {month:'汇总', month_num:0, columns, branch_rows:[...branchRows,totalRow]};
}

  if(gap<0 && q2<0) return `${rankText}，${gapText}，${q2Text}，覆盖节奏偏弱。${branchNotes[branch] || '下半年需要营业部总经理盯名单、盯员工、盯重点客户私募触达。'}`;
  return `${rankText}，${gapText}，${yoyText}、${q2Text}；${branchNotes[branch] || '下半年继续围绕重点客户和高系数产品做持续覆盖。'}`;
}
function coverageToneStyle(x, maxAbsGap){ if(x.branch==='分公司整体')return ''; const gap=x.rate-cover('20260630','分公司整体').rate; const strength=maxAbsGap?Math.min(1,Math.abs(gap)/maxAbsGap):0; const light=gap>=0?Math.round(47-strength*16):Math.round(35-strength*13); const hue=gap>=0?352:156; const sat=gap>=0?58:72; const alpha=(0.08+strength*0.12).toFixed(3); const color=`hsl(${hue} ${sat}% ${light}%)`; const border=`hsl(${hue} ${sat}% ${Math.min(72,light+26)}%)`; const bg=gap>=0?`rgba(196,61,75,${alpha})`:`rgba(21,131,91,${alpha})`; return `style="--tone:${color};--tone-border:${border};--tone-bg:${bg}"`; }
function coveragePill(x,maxAbsGap){ const companyRate=cover('20260630','分公司整体').rate; const tone=x.branch==='分公司整体'?'company':(x.rate>=companyRate?'above':'below'); return `<button class="coveragePill ${tone} ${x.branch===coverageBranch?'active':''}" data-b="${x.branch}" ${coverageToneStyle(x,maxAbsGap)}><span>${x.branch}</span><b>${pct(x.rate,2)}</b><span class="mini">${fmt0(x.hold)} / ${fmt0(x.total)} 户</span></button>`; }
function coverageRank(branch, rows){ const sorted=[...rows].sort((a,b)=>b.rate-a.rate); return sorted.findIndex(x=>x.branch===branch)+1; }
function renderCoverageConclusion(branch, rows){ const selected=cover('20260630',branch), companyNow=cover('20260630','分公司整体'), last=cover('20250630',branch), mar=cover('20260331',branch); const gap=selected.rate-companyNow.rate, yoy=selected.rate-last.rate, q2=selected.rate-mar.rate; const rank=branch==='分公司整体'?'分公司整体':coverageRank(branch,rows); const cls=gap>=0?'good':'low'; el('coverageConclusion').innerHTML=`<strong>${branch}</strong> 2026-06-30覆盖率 ${pct(selected.rate,2)}，${gap>=0?'高于':'低于'}分公司 <strong class="${gap>=0?'aboveCompany':'belowCompany'}">${diffPct(gap)}</strong>。<div class="coverageFacts"><div class="coverageFact ${cls}"><span>当前覆盖客户</span><b>${fmt0(selected.hold)} / ${fmt0(selected.total)} 户</b></div><div class="coverageFact"><span>2025-06-30</span><b>${pct(last.rate,2)}</b></div><div class="coverageFact"><span>2026-03-31</span><b>${pct(mar.rate,2)}</b></div><div class="coverageFact"><span>同比变动</span><b class="${yoy>=0?'aboveCompany':'belowCompany'}">${diffPct(yoy)}</b></div><div class="coverageFact"><span>二季度变动</span><b class="${q2>=0?'aboveCompany':'belowCompany'}">${diffPct(q2)}</b></div>${branch==='分公司整体'?'':`<div class="coverageFact"><span>营业部排名</span><b>第 ${rank} 名</b></div>`}</div><div class="coverageNarrative">${coverageComment(branch)}</div>`; }
function renderCoverage(){ const latest=DATA.coverageSnapshots.filter(x=>x.date==='20260630'); const branchLatest=latest.filter(x=>x.branch!=='分公司整体'); const companyNow=cover('20260630','分公司整体'); const maxAbsGap=Math.max(...branchLatest.map(x=>Math.abs(x.rate-companyNow.rate)),0.0001); el('companyCoverage').innerHTML=coveragePill(latest.find(x=>x.branch==='分公司整体'),maxAbsGap); el('coverageBranches').innerHTML=branchLatest.map(x=>coveragePill(x,maxAbsGap)).join(''); document.querySelectorAll('.coveragePill').forEach(b=>b.onclick=()=>{ coverageBranch=b.dataset.b; renderCoverage(); }); const companySeries=trendDates.map(d=>cover(d,'分公司整体').rate); const branchSeries=trendDates.map(d=>cover(d,coverageBranch).rate); coverageTrendChart.setOption({ tooltip:{trigger:'axis',valueFormatter:v=>pct(v,2)}, legend:{top:0}, grid:{left:52,right:22,top:38,bottom:44}, xAxis:{type:'category',data:trendDates.map(dateLabel)}, yAxis:{type:'value',axisLabel:{formatter:v=>(v*100).toFixed(0)+'%'}}, series:[{name:'分公司整体',type:'line',smooth:true,data:companySeries,itemStyle:{color:'#2563a8'}},{name:coverageBranch,type:'line',smooth:true,data:branchSeries,itemStyle:{color:'#c43d4b'}}] }); renderCoverageConclusion(coverageBranch,branchLatest); const rows=branchLatest.sort((a,b)=>b.rate-a.rate); el('coverageTable').innerHTML='<thead><tr><th>营业部</th><th>20250630</th><th>20260331</th><th>20260630</th><th>较分公司</th><th>同比变动</th><th>二季度变动</th><th>节奏判断</th></tr></thead><tbody>'+rows.map(x=>{const r25=cover('20250630',x.branch), r03=cover('20260331',x.branch), r06=cover('20260630',x.branch), gap=r06.rate-companyNow.rate, yoy=r06.rate-r25.rate, q2=r06.rate-r03.rate; const tone=coverageToneStyle(r06,maxAbsGap); return `<tr><td>${x.branch}</td><td>${pct(r25.rate,2)}</td><td>${pct(r03.rate,2)}</td><td ${tone}><b>${pct(r06.rate,2)}</b></td><td ${tone}>${diffPct(gap)}</td><td class="${yoy>=0?'toneRed':'toneGreen'}">${diffPct(yoy)}</td><td class="${q2>=0?'toneRed':'toneGreen'}">${diffPct(q2)}</td><td class="comment">${coverageComment(x.branch)}</td></tr>`;}).join('')+'</tbody>'; }
renderCoverage(); window.addEventListener('resize',()=>{ yoyChart.resize(); coverageTrendChart.resize(); });
</script></body></html>
