function coveragePill(x,maxAbsGap){const companyRate=cover('20260630','分公司整体').rate;const tone=x.branch==='分公司整体'?'company':(x.rate>=companyRate?'above':'below');return `<button class="coveragePill ${tone} ${x.branch===coverageBranch?'active':''}" data-b="${x.branch}" ${coverageToneStyle(x,maxAbsGap)}><span>${x.branch}</span><b>${pct(x.rate,2)}</b><span class="mini">${fmt0(x.hold)} / ${fmt0(x.total)} 户</span></button>`}
function coverageRank(branch, rows){const sorted=[...rows].sort((a,b)=>b.rate-a.rate);return sorted.findIndex(x=>x.branch===branch)+1;}
function renderCoverageConclusion(branch, rows){const selected=cover('20260630',branch), companyNow=cover('20260630','分公司整体'), last=cover('20250630',branch), mar=cover('20260331',branch);const gap=selected.rate-companyNow.rate, yoy=selected.rate-last.rate, q2=selected.rate-mar.rate;const rank=branch==='分公司整体'?'分公司整体':coverageRank(branch,rows);const cls=gap>=0?'good':'low';el('coverageConclusion').innerHTML=`<strong>${branch}</strong> 2026-06-30覆盖率 ${pct(selected.rate,2)}，${gap>=0?'高于':'低于'}分公司 <strong class="${gap>=0?'aboveCompany':'belowCompany'}">${diffPct(gap)}</strong>。<div class="coverageFacts"><div class="coverageFact ${cls}"><span>当前覆盖客户</span><b>${fmt0(selected.hold)} / ${fmt0(selected.total)} 户</b></div><div class="coverageFact"><span>2025-06-30</span><b>${pct(last.rate,2)}</b></div><div class="coverageFact"><span>2026-03-31</span><b>${pct(mar.rate,2)}</b></div><div class="coverageFact"><span>同比变动</span><b class="${yoy>=0?'aboveCompany':'belowCompany'}">${diffPct(yoy)}</b></div><div class="coverageFact"><span>二季度变动</span><b class="${q2>=0?'aboveCompany':'belowCompany'}">${diffPct(q2)}</b></div>${branch==='分公司整体'?'':`<div class="coverageFact"><span>营业部排名</span><b>第 ${rank} 名</b></div>`}</div><div class="coverageNarrative">${coverageComment(branch)}</div>`;}
function renderCoverage(){const latest=DATA.coverageSnapshots.filter(x=>x.date==='20260630');const branchLatest=latest.filter(x=>x.branch!=='分公司整体');const companyNow=cover('20260630','分公司整体');const maxAbsGap=Math.max(...branchLatest.map(x=>Math.abs(x.rate-companyNow.rate)),0.0001);el('companyCoverage').innerHTML=coveragePill(latest.find(x=>x.branch==='分公司整体'),maxAbsGap);el('coverageBranches').innerHTML=branchLatest.map(x=>coveragePill(x,maxAbsGap)).join('');document.querySelectorAll('.coveragePill').forEach(b=>b.onclick=()=>{coverageBranch=b.dataset.b;renderCoverage();});const companySeries=trendDates.map(d=>cover(d,'分公司整体').rate);const branchSeries=trendDates.map(d=>cover(d,coverageBranch).rate);coverageTrendChart.setOption({tooltip:{trigger:'axis',valueFormatter:v=>pct(v,2)},legend:{top:0},grid:{left:52,right:22,top:38,bottom:44},xAxis:{type:'category',data:trendDates.map(dateLabel)},yAxis:{type:'value',axisLabel:{formatter:v=>(v*100).toFixed(0)+'%'}},series:[{name:'分公司整体',type:'line',smooth:true,data:companySeries,itemStyle:{color:'#2563a8'}},{name:coverageBranch,type:'line',smooth:true,data:branchSeries,itemStyle:{color:'#c43d4b'}}]});renderCoverageConclusion(coverageBranch,branchLatest);const rows=branchLatest.sort((a,b)=>b.rate-a.rate);el('coverageTable').innerHTML='<thead><tr><th>营业部</th><th>20250630</th><th>20260331</th><th>20260630</th><th>较分公司</th><th>同比变动</th><th>二季度变动</th><th>节奏判断</th></tr></thead><tbody>'+rows.map(x=>{const r25=cover('20250630',x.branch), r03=cover('20260331',x.branch), r06=cover('20260630',x.branch), gap=r06.rate-companyNow.rate, yoy=r06.rate-r25.rate, q2=r06.rate-r03.rate;return `<tr><td>${x.branch}</td><td>${pct(r25.rate,2)}</td><td>${pct(r03.rate,2)}</td><td>${pct(r06.rate,2)}</td><td class="${gap>=0?'aboveCompany':'belowCompany'}">${diffPct(gap)}</td><td>${diffPct(yoy)}</td><td>${diffPct(q2)}</td><td class="comment">${coverageComment(x.branch)}</td></tr>`}).join('')+'</tbody>';}
renderCoverage();window.addEventListener('resize',()=>{monthChart.resize();coverageTrendChart.resize();});
</script></body></html>
